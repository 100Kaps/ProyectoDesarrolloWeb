<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panadería San Carlos - Detalle de Pedido</title>
  <!-- Ruta CSS relativa directa para la carpeta public -->
  <link rel="stylesheet" href="./css/styles.css">
  <style>
    .info-header { margin-bottom: 20px; }
    .badge-turno {
      display: inline-block;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: #e0f2fe;
      color: #0369a1;
      margin-right: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Panadería San Carlos - Detalle de Pedido</h1>
    <nav style="margin-top: 10px;">
      <a href="./index.html">← Volver al Inicio</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <div id="encabezado-pedido" class="info-header">
        <h2>Cargando información del pedido...</h2>
      </div>

      <h3>Productos Solicitados</h3>
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad Total</th>
            <th>Desglose por Turno / Jornada</th>
          </tr>
        </thead>
        <tbody id="tabla-detalle-body">
          <tr><td colspan="3">Cargando detalles...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Reemplaza con las claves reales de tu proyecto de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSy...", 
      authDomain: "proyectodesarrolloweb-a1a36.firebaseapp.com",
      projectId: "proyectodesarrolloweb-a1a36",
      storageBucket: "proyectodesarrolloweb-a1a36.appspot.com",
      messagingSenderId: "10355840983556789386",
      appId: "1:10355840983556789386:web:..."
    };

    // Inicializar Firebase Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function cargarDetalle() {
      const urlParams = new URLSearchParams(window.location.search);
      const idPedido = urlParams.get('id');

      if (!idPedido) {
        document.getElementById('encabezado-pedido').innerHTML = '<h2 style="color: #c2410c;">No se especificó un ID de pedido en la URL.</h2>';
        document.getElementById('tabla-detalle-body').innerHTML = '<tr><td colspan="3">Sin información.</td></tr>';
        return;
      }

      try {
        // Consultar directamente el documento por ID en la colección "pedidos"
        const docRef = doc(db, "pedidos", idPedido);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const pedido = docSnap.data();

          // 1. Mostrar encabezado
          document.getElementById('encabezado-pedido').innerHTML = `
            <h2>Pedido #${docSnap.id.substring(0, 6)}</h2>
            <p><strong>Sucursal:</strong> ${pedido.sucursal || 'N/A'} | 
               <strong>Ruta:</strong> ${pedido.ruta || 'N/A'} | 
               <strong>Fecha:</strong> ${pedido.fecha || 'N/A'} | 
               <strong>Estado:</strong> <span class="badge">${(pedido.estado || 'PENDIENTE').toUpperCase()}</span></p>
          `;

          // 2. Mostrar productos
          const body = document.getElementById('tabla-detalle-body');
          const detalles = pedido.detalles || [];

          if (detalles.length > 0) {
            body.innerHTML = detalles.map(d => {
              const producto = d.producto || 'Producto sin nombre';
              const cantManana = parseInt(d.cant_manana) || 0;
              const cantResto = parseInt(d.cant_resto) || 0;
              const cantTarde = parseInt(d.cant_tarde) || 0;
              const total = cantManana + cantResto + cantTarde;

              let turnosHtml = [];
              if (cantManana > 0) turnosHtml.push(`<span class="badge-turno">Mañana: ${cantManana}</span>`);
              if (cantResto > 0) turnosHtml.push(`<span class="badge-turno">Resto: ${cantResto}</span>`);
              if (cantTarde > 0) turnosHtml.push(`<span class="badge-turno">Tarde: ${cantTarde}</span>`);

              const desglose = turnosHtml.length > 0 ? turnosHtml.join(' ') : 'Sin cantidad especificada';

              return `
                <tr>
                  <td><strong>${producto}</strong></td>
                  <td><strong>${total}</strong></td>
                  <td>${desglose}</td>
                </tr>
              `;
            }).join('');
          } else {
            body.innerHTML = '<tr><td colspan="3">Este pedido no contiene productos registrados.</td></tr>';
          }
        } else {
          document.getElementById('encabezado-pedido').innerHTML = '<h2 style="color: #c2410c;">El pedido solicitado no existe en la base de datos.</h2>';
          document.getElementById('tabla-detalle-body').innerHTML = '<tr><td colspan="3">Sin registros.</td></tr>';
        }
      } catch (error) {
        console.error('Error al consultar Firestore:', error);
        document.getElementById('encabezado-pedido').innerHTML = '<h2 style="color: #c2410c;">Error al conectar con la base de datos.</h2>';
        document.getElementById('tabla-detalle-body').innerHTML = '<tr><td colspan="3">Verifica la consola para más información.</td></tr>';
      }
    }

    // Ejecutar al cargar la página
    cargarDetalle();
  </script>
</body>
</html>
