<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Pedido - Panadería San Carlos</title>
  <!-- Ruta relativa al CSS directamente desde public/ -->
  <link rel="stylesheet" href="./css/styles.css">
  <style>
    .info-header { margin-bottom: 20px; }
    .badge-turno { 
      font-weight: bold; 
      padding: 4px 8px; 
      border-radius: 4px; 
      background-color: #e0f2fe; 
      color: #0369a1; 
    }
  </style>
</head>
<body>

  <header>
    <h1>Panadería San Carlos - Detalle de Pedido</h1>
    <nav style="margin-top: 10px;">
      <a href="./index.html">← Volver al Inicio</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <div id="encabezado-pedido" class="info-header">
        <h2>Cargando información del pedido...</h2>
      </div>

      <h3>Productos Solicitados</h3>
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Mañana</th>
            <th>Resto</th>
            <th>Tarde</th>
          </tr>
        </thead>
        <tbody id="tabla-detalle-body">
          <tr><td colspan="4">Cargando detalles...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- Se importa api.js como módulo ES Web -->
  <script type="module" src="./js/api.js"></script>
  <script type="module">
    // Importamos las funciones necesarias del SDK de Firebase desde CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Reemplaza con tus credenciales de Firebase
    const firebaseConfig = {
      apiKey: "TU_API_KEY_AQUI",
      authDomain: "proyectodesarrolloweb-a1a36.firebaseapp.com",
      projectId: "proyectodesarrolloweb-a1a36",
      storageBucket: "proyectodesarrolloweb-a1a36.appspot.com",
      messagingSenderId: "10355840983556789386",
      appId: "TU_APP_ID_AQUI"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Obtener el ID del pedido desde los parámetros de la URL (?id=DOCUMENT_ID)
      const urlParams = new URLSearchParams(window.location.search);
      const idPedido = urlParams.get('id');

      if (!idPedido) {
        document.getElementById('encabezado-pedido').innerHTML = '<h2 style="color: red;">No se especificó un ID de pedido en la URL.</h2>';
        document.getElementById('tabla-detalle-body').innerHTML = '<tr><td colspan="4">Sin información.</td></tr>';
        return;
      }

      try {
        // 2. Consultar el documento del pedido directamente en Cloud Firestore
        const docRef = doc(db, "pedidos", idPedido);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const pedido = docSnap.data();

          // Renderizar información de la cabecera
          document.getElementById('encabezado-pedido').innerHTML = `
            <h2>Pedido #${docSnap.id.substring(0, 6)}</h2>
            <p><strong>Sucursal:</strong> ${pedido.sucursal || 'N/A'} | 
               <strong>Ruta:</strong> ${pedido.ruta || 'N/A'} | 
               <strong>Fecha:</strong> ${pedido.fecha || 'N/A'} | 
               <strong>Estado:</strong> <span class="badge">${(pedido.estado || 'PENDIENTE').toUpperCase()}</span></p>
          `;

          // Renderizar los detalles (productos, mañana, resto y tarde)
          const body = document.getElementById('tabla-detalle-body');
          const detalles = pedido.detalles || [];

          if (detalles.length > 0) {
            body.innerHTML = detalles.map(d => `
              <tr>
                <td><strong>${d.producto}</strong></td>
                <td><span class="badge-turno">${d.cant_manana || 0}</span></td>
                <td><span class="badge-turno">${d.cant_resto || 0}</span></td>
                <td><span class="badge-turno">${d.cant_tarde || 0}</span></td>
              </tr>
            `).join('');
          } else {
            body.innerHTML = '<tr><td colspan="4">Este pedido no contiene productos registrados.</td></tr>';
          }
        } else {
          document.getElementById('encabezado-pedido').innerHTML = '<h2 style="color: red;">El pedido solicitado no existe en Firebase.</h2>';
          document.getElementById('tabla-detalle-body').innerHTML = '<tr><td colspan="4">Sin datos.</td></tr>';
        }
      } catch (error) {
        console.error('Error al obtener el detalle en Firebase:', error);
        document.getElementById('tabla-detalle-body').innerHTML = '<tr><td colspan="4">Error al conectar con la base de datos.</td></tr>';
      }
    });
  </script>
</body>
</html>
