<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panadería San Carlos - Control de Producción</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .btn-detalle {
      display: inline-block;
      margin-left: 8px;
      padding: 5px 10px;
      background-color: #0284c7;
      color: #ffffff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .btn-detalle:hover {
      background-color: #0369a1;
    }
    .btn-entregar {
      padding: 5px 10px;
      background-color: #16a34a;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
    }
    .btn-entregar:hover {
      background-color: #15803d;
    }
    .badge-entregado {
      font-weight: bold;
      color: #16a34a;
      padding: 4px 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Panadería San Carlos - UMG</h1>
    <nav>
      <a href="/" class="active">Inicio</a>
      <a href="/pedidos">Captura de Pedidos</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Pedidos Registrados</h2>
      <p>Listado general de pedidos enviados por las sucursales.</p>
      <table>
        <thead>
          <tr>
            <th>ID Pedido</th>
            <th>Sucursal</th>
            <th>Ruta</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-pedidos-body">
          <tr><td colspan="6">Cargando pedidos...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script>
    // Function tapno mabaliwan ti estado ti pedido agingga 'ENTREGADO'
    async function marcarComoEntregado(idPedido) {
      if (!confirm(`¿Estás seguro de marcar el pedido #${idPedido} como ENTREGADO?`)) {
        return;
      }

      try {
        const response = await fetch(`/api/pedidos/${idPedido}/estado`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ estado: 'ENTREGADO' })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          alert(`El pedido #${idPedido} ha sido marcado como ENTREGADO.`);
          cargarPedidos(); // Recargar la tabla automáticamente
        } else {
          alert(`Error: ${result.message || 'No se pudo actualizar el estado'}`);
        }
      } catch (error) {
        console.error('Error al actualizar el estado:', error);
        alert('Ocurrió un error al intentar cambiar el estado.');
      }
    }

    // Function tapno maikabil dagiti pedidos iti tabla
    async function cargarPedidos() {
      const body = document.getElementById('tabla-pedidos-body');
      try {
        const response = await API.getPedidos();
        if (response.success && response.data.length > 0) {
          body.innerHTML = response.data.map(p => {
            // Manejo de compatibilidad mayúsculas/minúsculas de Oracle
            const idPed = p.ID_PEDIDO || p.id_pedido;
            const sucursal = p.SUCURSAL || p.sucursal;
            const ruta = p.RUTA || p.ruta;
            const fecha = p.FECHA || p.fecha;
            const estadoVal = (p.ESTADO || p.estado || '').toUpperCase();

            // Botón según el estado actual
            const botonAccion = estadoVal === 'PENDIENTE'
              ? `<button class="btn-entregar" onclick="marcarComoEntregado(${idPed})">Marcar Entregado</button>`
              : `<span class="badge-entregado">ENTREGADO</span>`;

            // Enlace para abrir el detalle en una nueva pestaña (target="_blank")
            const botonDetalle = `<a href="/pedidos/detalle?id=${idPed}" target="_blank" class="btn-detalle">Ver Detalle</a>`;

            return `
              <tr>
                <td>#${idPed}</td>
                <td>${sucursal}</td>
                <td>${ruta}</td>
                <td>${fecha}</td>
                <td><span class="badge">${estadoVal}</span></td>
                <td>
                  ${botonAccion}
                  ${botonDetalle}
                </td>
              </tr>
            `;
          }).join('');
        } else {
          body.innerHTML = '<tr><td colspan="6">No hay pedidos registrados aún.</td></tr>';
        }
      } catch (err) {
        console.error(err);
        body.innerHTML = '<tr><td colspan="6">Error al cargar pedidos.</td></tr>';
      }
    }

    document.addEventListener('DOMContentLoaded', cargarPedidos);
  </script>
</body>
</html>
