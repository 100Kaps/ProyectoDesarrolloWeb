<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panadería San Carlos - Control de Producción</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <header>
    <h1>Panadería San Carlos - UMG</h1>
    <nav>
      <a href="/" class="active">Inicio</a>
      <a href="/pedidos">Captura de Pedidos</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Pedidos Registrados</h2>
      <p>Listado general de pedidos enviados por las 5 sucursales.</p>
      <table>
        <thead>
          <tr>
            <th>ID Pedido</th>
            <th>Sucursal</th>
            <th>Ruta</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Acción</th> <!-- Nueva columna para el botón -->
          </tr>
        </thead>
        <tbody id="tabla-pedidos-body">
          <tr><td colspan="6">Cargando pedidos...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    // 1. Función para cambiar el estado del pedido en la API
    async function marcarComoEntregado(idPedido) {
      if (!confirm(`¿Estás seguro de marcar el pedido #${idPedido} como ENTREGADO?`)) {
        return;
      }

      try {
        const response = await fetch(`/api/pedidos/${idPedido}/estado`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ estado: 'ENTREGADO' })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          alert(`El pedido #${idPedido} ha sido marcado como ENTREGADO.`);
          cargarPedidos(); // Recarga la tabla de pedidos
        } else {
          alert(`Error: ${result.message}`);
        }
      } catch (error) {
        console.error('Error al actualizar el estado:', error);
        alert('Ocurrió un error al intentar cambiar el estado.');
      }
    }

    // 2. Función para cargar y renderizar los pedidos en la tabla
    async function cargarPedidos() {
      const body = document.getElementById('tabla-pedidos-body');
      try {
        const response = await API.getPedidos();
        if (response.success && response.data.length > 0) {
          body.innerHTML = response.data.map(p => {
            // Si el estado es PENDIENTE, dibuja el botón. Si es ENTREGADO, muestra el texto.
            const botonAccion = p.ESTADO === 'PENDIENTE'
              ? `<button class="btn-entregar" onclick="marcarComoEntregado(${p.ID_PEDIDO})">Marcar Entregado</button>`
              : `<span class="badge-entregado">ENTREGADO</span>`;

            return `
              <tr>
                <td>${p.ID_PEDIDO}</td>
                <td>${p.SUCURSAL}</td>
                <td>${p.RUTA}</td>
                <td>${p.FECHA}</td>
                <td><span class="badge">${p.ESTADO}</span></td>
                <td>${botonAccion}</td>
              </tr>
            `;
          }).join('');
        } else {
          body.innerHTML = '<tr><td colspan="6">No hay pedidos registrados aún.</td></tr>';
        }
      } catch (err) {
        body.innerHTML = '<tr><td colspan="6">Error al cargar pedidos.</td></tr>';
      }
    }

    // Inicializar al cargar la página
    document.addEventListener('DOMContentLoaded', cargarPedidos);
  </script>
</body>
</html>
